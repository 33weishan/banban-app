<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>即時庫存</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC",
                   "Microsoft JhengHei", Arial, sans-serif;
      color: #111;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 22px 10px 12px;
    }

    h1 {
      margin: 0 0 18px;
      text-align: center;
      font-size: 34px;
      line-height: 1.2;
    }

    .sheet-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    iframe {
      display: block;
      width: 100%;
      min-width: 780px;
      height: 1600px;
      border: 0;
      background: #fff;
    }

    @media (max-width: 600px) {
      .page {
        padding: 18px 6px 8px;
      }

      h1 {
        font-size: 32px;
        margin-bottom: 14px;
      }

      iframe {
        min-width: 760px;
        height: 1700px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>即時庫存</h1>

    <div class="sheet-wrap">
      <iframe
        title="即時庫存表"
        src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSs95HL2x2rqMQvpLhgCKHwEXEae6haIm8aFaA5zq13VYu6GbDpzbx07Z4as_AkMg/gviz/tq?tqx=out:html&gid=181370413">
      </iframe>
    </div>
  </main>
</body>
</html>
